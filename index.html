<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html" charset="utf-8" />
        <title>Epsilon Delta Visualization</title>
        <!--This sets up connecting to Babylon-->
        <script src="https://cdn.babylonjs.com/babylon.max.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <style>

            html,
            body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
            }
        </style>
    </head>

    <body>
        <canvas id="renderCanvas"></canvas>
        <script>
            window.addEventListener('DOMContentLoaded', async function () {
                // get the canvas DOM element
                const canvas = document.getElementById('renderCanvas');
                // load the 3D engine
                const engine = new BABYLON.Engine(canvas, true);
                // createScene function that creates and return the scene

                let positionLabel;
                //functions
                let func_num = 0;
                const func0 = (x, z) => Math.pow(Math.cos((x*x+z*z)/100),2)*20*Math.exp((-x*x-z*z)/500)
                                + 5*Math.exp((-x*x-z*z)/500);
                const func1 = (x, z) => 20*(x*x)/((x+0.0001)*(x+0.0001)+(z+0.0001)*(z+0.0001))
                        + Math.sqrt(Math.abs(x))*Math.sin(1/4*(x+z));
                const funcs = [func0, func1];
                let func = func0;
                let reload_curve = false;

                const createScene = async function () {
                    //scene
                    const scene = new BABYLON.Scene(engine);
                    scene.clearColor = new BABYLON.Color3(0.1, 0.08, 0.3);

                    const dome = BABYLON.MeshBuilder.CreateSphere("starDome", { diameter: 1000, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
                    const domeMat = new BABYLON.StandardMaterial("domeMat", scene);
                    domeMat.diffuseTexture = new BABYLON.Texture("https://images-assets.nasa.gov/image/PIA15415/PIA15415~medium.jpg", scene);
                    domeMat.backFaceCulling = false;
                    domeMat.specularColor = new BABYLON.Color3(0,0,0);
                    dome.material = domeMat;
                    dome.rotation.x = Math.PI;

                    //camera
                    const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0,7,83), scene);
                    camera.attachControl(canvas, true);
                    camera.target = new BABYLON.Vector3.Zero();

                    //light
                    const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
                    hemiLight.intensity = 1.0;

                    //ground
                    const ground = BABYLON.MeshBuilder.CreateGround("ground1", { width: 300, height: 300 }, scene);
                    ground.position.y = -5;
                    const groundMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
                    groundMaterial.diffuseColor = new BABYLON.Color3(0,0,0);
                    groundMaterial.wireframe = true;
                    ground.material = groundMaterial;

                    //starting platform
                    const platform = BABYLON.CreateGround('platform',{width: 5, height:5},scene);
                    platform.position = new BABYLON.Vector3(0,5,83);
                    const platMaterial = new BABYLON.StandardMaterial("groundMaterial", scene);
                    platMaterial.diffuseColor = new BABYLON.Color3(0,0,0);
                    platMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
                    platMaterial.alpha = 0.5;
                    platform.material = platMaterial;

                    //moveable point
                    const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {
                        diameter: 0.5,        // Full diameter of the sphere
                        segments: 32        // Number of horizontal segments (higher = smoother)
                        }, scene);
                    sphere.position = new BABYLON.Vector3(0,2,65);
                    const sphereTexture = new BABYLON.StandardMaterial('sphereTexture',scene);
                    sphereTexture.diffuseColor = new BABYLON.Color3(0,0,0);
                    sphereTexture.specularColor = new BABYLON.Color3(0, 0, 0);
                    sphere.material = sphereTexture;
                 
                    //graph
                    function createGraphMesh(scene, size, step, heightFunction) {
                        const graphPositions = [];
                        const graphIndices = [];
                        const graphNormals = [];
                        const graphColors = [];

                        const cols = Math.floor((2 * size) / step) + 1;
                        const rows = cols;

                        let minY = Infinity;
                        let maxY = -Infinity;

                        // Generate vertex positions
                        for (let row = 0; row < rows; row++) {
                            const x = -size + row * step;
                            for (let col = 0; col < cols; col++) {
                                const z = -size + col * step;
                                const y = heightFunction(x, z);
                                graphPositions.push(x, y, z);
                                minY = Math.min(minY, y);
                                maxY = Math.max(maxY, y);
                            }
                        }

                        // Generate triangle indices

                        for (let row = 0; row < rows - 1; row++) {
                            for (let col = 0; col < cols - 1; col++) {
                                const i0 = row * cols + col;
                                const i1 = i0 + 1;
                                const i2 = i0 + cols;
                                const i3 = i2 + 1;

                                if (i3 < graphPositions.length / 3) {
                                    graphIndices.push(i0, i1, i2);
                                    graphIndices.push(i1, i3, i2);
                                }

                            }
                        }

                        // Assign vertex colors based on height
                        for (let i = 0; i < graphPositions.length; i += 3) {
                            const y = graphPositions[i + 1];
                            const t = (y - minY) / (maxY - minY);
                            const r = t;
                            const g = 0.2;
                            const b = 1 - t;
                            graphColors.push(r, g, b, 1);
                        }

                        // Compute normals and apply to mesh
                        const graphMesh = new BABYLON.Mesh("graph", scene);
                        const vertexData = new BABYLON.VertexData();
                        BABYLON.VertexData.ComputeNormals(graphPositions, graphIndices, graphNormals);

                        vertexData.positions = graphPositions;
                        vertexData.indices = graphIndices;
                        vertexData.normals = graphNormals;
                        vertexData.colors = graphColors;
                        vertexData.applyToMesh(graphMesh);

                        // Material setup
                        const graphMaterial = new BABYLON.StandardMaterial("graphMaterial", scene);
                        graphMaterial.diffuseColor = new BABYLON.Color3(1, 1, 1);
                        graphMaterial.vertexColorEnabled = true;
                        graphMaterial.backFaceCulling = false;
                        graphMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1); // Full brightness
                        // graphMaterial.wireframe = true;
                        graphMesh.material = graphMaterial;

                        return graphMesh;
                    };
                    let graph = createGraphMesh(scene, 70, 0.25, func);

                    //vr set up
                    const xrHelper = await scene.createDefaultXRExperienceAsync({
                            floorMeshes: [ground,platform, graph], // Use your custom ground for teleportation
                            disableTeleportation: false,
                        })
                    xrCamera = xrHelper.baseExperience.camera;
                    xrCamera.position = new BABYLON.Vector3(0,7,83);
                    
                    // delta curve
                    function createCurve(scene, radius, step, heightFunction){
                        surface_points = [];
                        for (theta = 0; theta <= 2*Math.PI+step; theta += step){
                            const x = radius*Math.cos(theta);
                            const z = radius*Math.sin(theta);
                            const y = heightFunction(x,z); 
                            surface_points.push(new BABYLON.Vector3(x,y,z))
                        }
                        
                        const curve = BABYLON.MeshBuilder.CreateLines('deltaCurve',{points:surface_points},scene);
                        return curve
                    }
                    const surfaceCurve = createCurve(scene, 10,0.02,func);
                    surfaceCurve.position.y += 0.1
                    
                    //line at the origin
                    const points = [
                        new BABYLON.Vector3(0, 0, 0),
                        new BABYLON.Vector3(0, 50, 0),
                        ];
                    const line = BABYLON.MeshBuilder.CreateLines("line", { points: points }, scene);

                    // keyboard input
                    camera.keysUp.push(87);
                    camera.keysDown.push(83);
                    camera.keysLeft.push(65);
                    camera.keysRight.push(68);
                    scene.onKeyboardObservable.add((kbInfo) => {
                       switch (kbInfo.type) {
                           case BABYLON.KeyboardEventTypes.KEYDOWN:
                               if (kbInfo.event.key === "e") {
                                   camera.cameraDirection.y += 0.2;
                               }
                                if (kbInfo.event.key === "q") {
                                    camera.cameraDirection.y -= 0.2;
                                }
                                if (kbInfo.event.key === "n"){
                                    func_num = (func_num + 1) % funcs.length;
                                    func = funcs[func_num];
                                    sphere.position =  new BABYLON.Vector3(0,2,65);
                                    camera.position = new BABYLON.Vector3(0,7,83);
                                    camera.target = new BABYLON.Vector3.Zero();
                                    graph.dispose();
                                    graph = createGraphMesh(scene, 70, 0.25, func);
                                    
                                };
                                break;
                        }
                    });
                    camera.inputs.attached.mouse.buttons = [0]; // Only respond to left-click

                    // Drag logic for keyboard
                    let isDragging = false;
                    let dragPlane = BABYLON.MeshBuilder.CreatePlane("dragPlane", { size: 100 }, scene);
                    dragPlane.isVisible = false;
                    scene.onPointerDown = function (evt, pickResult) {
                        if (evt.button === 2 && pickResult.hit && pickResult.pickedMesh === sphere) {
                            isDragging = true;
                            dragPlane.position = sphere.position.clone();
                            dragPlane.lookAt(camera.position);
                        }};
                    scene.onPointerUp = function () {
                        isDragging = false;
                    };
                    scene.onPointerMove = function (evt) {
                        if (!isDragging) return;

                        const pick = scene.pick(scene.pointerX, scene.pointerY, mesh => mesh === dragPlane);
                        if (pick.hit) {
                            sphere.position.x = pick.pickedPoint.x;
                            sphere.position.z = pick.pickedPoint.z;
                        }
                    };
                    
                    // bottons for VR (drag logic and teleport button)
                    xrHelper.input.onControllerAddedObservable.add(controller => {
                        controller.onMotionControllerInitObservable.add(motionController => {
                            const triggerComponent = motionController.getComponent("trigger");

                            if (triggerComponent) {
                                triggerComponent.onButtonStateChangedObservable.add(() => {
                                    if (triggerComponent.pressed) {
                                        console.log("Trigger is pressed!");
                                    } else {
                                        console.log("Trigger is released.");
                                    }
                                });
                            }

                            const aButton = motionController.getComponent("a-button");
                            if (aButton) {
                                aButton.onButtonStateChangedObservable.add(() => {
                                    if (aButton.changes.pressed && aButton.pressed) {
                                        const userPos = xrHelper.baseExperience.camera.position;
                                        sphere.position = userPos.clone(); 
                                    }
                                });

                            };

                            const bButton = motionController.getComponent("b-button");
                            if (bButton) {
                                bButton.onButtonStateChangedObservable.add(() => {
                                    if (bButton.changes.pressed && bButton.pressed) {
                                        func_num = (func_num + 1) % funcs.length;
                                        func = funcs[func_num];
                                        sphere.position =  new BABYLON.Vector3(0,2,65);
                                        xrCamera.position = new BABYLON.Vector3(0,7,83);
                                        xrHelper.teleportation.removeFloorMesh(graph);
                                        graph.dispose();
                                        graph = createGraphMesh(scene, 70, 0.25, func);
                                        xrHelper.teleportation.addFloorMesh(graph);
                                    }
                                });

                            };
                        });
                    });


                    // //text for min and max values
                    // const textPlane = BABYLON.MeshBuilder.CreatePlane("textPlane", { width: 1.5, height: 0.8 }, scene);
                    // textPlane.position = new BABYLON.Vector3(0, 2, 2);

                    // const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(textPlane);
                    // positionLabel = new BABYLON.GUI.TextBlock();
                    // positionLabel.text = "";
                    // positionLabel.color = "white";
                    // positionLabel.fontSize = 24;
                    // positionLabel.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                    // positionLabel.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
                    // positionLabel.paddingRight = 20;
                    // positionLabel.paddingTop = 20;
                    // advancedTexture.addControl(positionLabel);

                    // //text for info
                    // infoLabel = new BABYLON.GUI.TextBlock();
                    // infoLabel.text = "           VR Controls\n- Joystick: Teleportantion\n- "+
                    //                     "Trigger: Moving sphere\n- A: Teleport sphere\n- B: Switch graphs";
                    // infoLabel.color = "white";
                    // infoLabel.fontSize = 15;
                    // infoLabel.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_Left;
                    // infoLabel.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
                    // infoLabel.paddingLeft = 20;
                    // infoLabel.paddingTop = 20;
                    // advancedTexture.addControl(infoLabel);

                    // // text follow camera
                    // xrHelper.baseExperience.onStateChangedObservable.add((state) => {
                    //     if (state === BABYLON.WebXRState.IN_XR) {
                    //         textPlane.parent = xrHelper.baseExperience.camera;
                    //     }
                    // });

                    return scene;
                }

                // call the createScene function
                const scene = await createScene();
                
                let old_position = BABYLON.Vector3.Zero();
                // run the render loop
                engine.runRenderLoop(function () {
                    const sphere = scene.getMeshByName('sphere');
                    sphere.position.y = func(sphere.position.x,sphere.position.z)+0.5
                    const surfaceCurve = scene.getMeshByName('deltaCurve');
                    
                    // Rebuild the curve with the new radius
                    let min = 10000;
                    let max = -10000;
                    if (!old_position.equals(sphere.position)){
                        reload_curve = true;
                        old_position = sphere.position.clone();
                    }
                    if (reload_curve){
                        reload_curve = 0;
                        surfaceCurve.dispose();
                        const radius = Math.sqrt(sphere.position.x*sphere.position.x + sphere.position.z*sphere.position.z);
                        function createCurve(scene, radius, step, heightFunction){
                            surface_points = [];
                            for (theta = 0; theta <= 2*Math.PI+step; theta += step){
                                const x = radius*Math.cos(theta);
                                const z = radius*Math.sin(theta);
                                const y = heightFunction(x,z); 
                                surface_points.push(new BABYLON.Vector3(x,y,z))
                                for (rad=0.01; rad< radius; rad +=0.5){
                                    const x = rad*Math.cos(theta);
                                    const z = rad*Math.sin(theta);
                                    const y = heightFunction(x,z);
                                    if (y < min-0.01){
                                        min = y;
                                    };
                                    if (y > max+0.01){
                                        max = y;
                                    };
                                };
                                
                            };
                            
                            const curve = BABYLON.MeshBuilder.CreateLines('deltaCurve',{points:surface_points},scene);
                            return curve;
                        }
                        surfaceCurve.position.y += 0.1;
                        const newCurve = createCurve(scene, radius, 0.02, func);
                        newCurve.name = 'deltaCurve'; // Replace old curve
                        newCurve.position.y = 0.1;
                        //updates text
                        // positionLabel.text = `Max: ${max.toFixed(4)}\nMin: ${min.toFixed(4)}`;
                    }
                    
                    scene.render();

                });

                // the canvas/window resize event handler
                window.addEventListener('resize', function () {
                    engine.resize();
                });
            });
        </script>
    </body>
</html>
